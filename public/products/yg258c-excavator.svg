<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#f4f4f2"/>
  <ellipse cx="400" cy="640" rx="260" ry="26" fill="#e3e2dd"/>

  <!-- tracks -->
  <rect x="180" y="560" width="360" height="70" rx="35" fill="#17181a"/>
  <circle cx="215" cy="595" r="30" fill="#3a3b3d"/>
  <circle cx="290" cy="595" r="30" fill="#3a3b3d"/>
  <circle cx="365" cy="595" r="30" fill="#3a3b3d"/>
  <circle cx="440" cy="595" r="30" fill="#3a3b3d"/>
  <circle cx="505" cy="595" r="30" fill="#3a3b3d"/>

  <!-- undercarriage/body -->
  <rect x="230" y="500" width="270" height="70" rx="10" fill="#3a3b3d"/>

  <!-- upper cab body -->
  <g>
    <rect x="200" y="380" width="230" height="130" rx="14" fill="#ff6300"/>
    <rect x="220" y="400" width="90" height="70" rx="8" fill="#17181a"/>
    <rect x="230" y="410" width="70" height="45" rx="4" fill="#cfe7ef"/>
  </g>

  <!-- boom -->
  <path d="M410 420 L560 260 L610 275 L470 445 Z" fill="#e0560a"/>
  <!-- arm -->
  <path d="M560 260 L660 340 L630 380 L530 300 Z" fill="#ff6300"/>
  <!-- bucket -->
  <path d="M660 340 L700 400 L660 460 L600 440 L610 380 Z" fill="#17181a"/>

  <!-- hydraulic cylinders -->
  <rect x="440" y="330" width="16" height="90" rx="8" fill="#17181a" transform="rotate(-40 448 375)"/>
  <rect x="560" y="290" width="14" height="70" rx="7" fill="#17181a" transform="rotate(35 567 325)"/>

  <text x="400" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#8a8b8d">Product photo coming soon</text>
</svg>
